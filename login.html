{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow mt-4">
            <div class="card-header bg-dark text-white text-center py-3">
                <h5 class="mb-0">Portal Authentication</h5>
                <small class="text-secondary">Grassroots Performance Monitoring</small>
            </div>
            <div class="card-body p-4">
                {% if error_override %}
                    <div class="alert alert-danger">{{ error_override }}</div>
                {% endif %}
                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control touch-target" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control touch-target" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 touch-target fw-bold">Sign In</button>
                </form>
            </div>
            <div class="card-footer text-muted small text-center">
                <strong>Demo Accounts:</strong><br>
                admin_user / admin123 (Admin)<br>
                coach_ronald / coach123 (Trainer)<br>
                scout_mike / scout123 (Scout)
            </div>
        </div>
    </div>
</div>
{% endblock %}
