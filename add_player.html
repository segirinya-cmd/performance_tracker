{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Register New Athlete</h5>
            </div>
            <div class="card-body">
                <form action="/players/add" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Full Name</label>
                        <input type="text" name="full_name" class="form-control touch-target" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Date of Birth</label>
                        <input type="date" name="date_of_birth" class="form-control touch-target" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Tactical Position</label>
                        <select name="primary_position" class="form-select touch-target" required>
                            <option value="">Select Position...</option>
                            <option value="Goalkeeper">Goalkeeper</option>
                            <option value="Centre-Back">Centre-Back</option>
                            <option value="Full-Back">Full-Back</option>
                            <option value="Central Midfield">Central Midfield</option>
                            <option value="Winger">Winger</option>
                            <option value="Centre-Forward">Centre-Forward</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Preferred Foot</label>
                        <select name="preferred_foot" class="form-select touch-target" required>
                            <option value="Right">Right</option>
                            <option value="Left">Left</option>
                            <option value="Both">Both</option>
                        </select>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="/dashboard" class="btn btn-outline-secondary touch-target">Cancel</a>
                        <button type="submit" class="btn btn-primary touch-target px-4">Create Profile</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
